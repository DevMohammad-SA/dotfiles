#######################
#      WALLPAPER      #
#######################
output * bg /home/mohammad/Pictures/wallpapers/arch-minimal-wallpapers/wallpapers/full-hd/ayu-dark.png fill

#######################
#       CURSOR        #
#######################
seat seat0 xcursor_theme Adwaita 24

# Ensure GTK apps (like Brave or Thunar) pick up the theme
exec_always {
    gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
    gsettings set org.gnome.desktop.interface cursor-theme 'Moga-Dark'
    gsettings set org.gnome.desktop.interface cursor-size 24
}

#######################
#       MONITOR       #
#######################
output eDP-1 mode 1920x1080 @ 60.020 Hz
