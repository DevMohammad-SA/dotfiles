#######################
#      WALLPAPER      #
#######################
output * bg $HOME/path/to/wallpaper fill

#######################
#       CURSOR        #
#######################
seat seat0 xcursor_theme cursor_name

# Ensure GTK apps (like Brave or Thunar) pick up the theme
exec_always {
    gsettings set org.gnome.desktop.interface icon-theme 'Cursor-Name'
    gsettings set org.gnome.desktop.interface cursor-theme 'Cursor-Name'
    gsettings set org.gnome.desktop.interface cursor-size 24
}

#######################
#       MONITOR       #
#######################
output eDP-1 mode 1920x1080 @ 60.020 Hz
# You can get the names of your outputs by running: swaymsg -t get_outputs


